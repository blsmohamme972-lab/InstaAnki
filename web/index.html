<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09121b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A personal, offline medical learning gallery with spaced recall.">
  <title>InstaAnki — Your learning gallery</title>
  <link rel="stylesheet" href="styles.css">
  <script src="learning.js" defer></script>
  <script src="guidance.js" defer></script>
  <script src="topic-selection.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="app-header">
      <a class="brand" href="#feed" aria-label="InstaAnki home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M10 7 25 16 10 25Z" fill="currentColor"/><path d="M3 21h6l3-7 4 14 3-7h7" fill="none" stroke="#071719" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>Insta<span class="brand-light">Anki</span><small>YOUR LEARNING GALLERY</small></span>
      </a>
      <button type="button" class="local-badge" data-action="local-info" aria-label="View local storage information"><span class="status-dot"></span>On device</button>
    </header>
    <div id="state-warning" class="state-warning" role="alert" hidden></div>
    <main class="main-content" id="main-content" aria-label="Learning content">
      <section id="screen-feed" class="screen feed-screen" aria-label="Lesson feed">
        <div class="feed-toolbar">
          <div class="segmented" role="group" aria-label="Choose feed">
            <button class="selected" data-feed="all" type="button">For you</button>
            <button data-feed="due" type="button">Due <span id="feed-due-count" class="small-count" hidden>0</span></button>
            <button data-feed="saved" type="button">Saved</button>
          </div>
          <button class="icon-button filter-button" type="button" data-action="filters" aria-label="Filter lessons"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span id="filter-indicator" hidden></span></button>
        </div>
        <div class="feed-viewport" id="feed-viewport">
          <article class="lesson-card" id="lesson-card" aria-label="Current lesson" tabindex="0" hidden>
            <ol class="lesson-steps" id="lesson-steps" aria-label="Lesson progress"><li data-lesson-step="watch" class="is-current" aria-current="step"><span>1</span> Watch</li><li data-lesson-step="answer"><span>2</span> Answer</li><li data-lesson-step="result"><span>3</span> Result</li></ol>
            <div class="visual-stage" id="visual-stage">
              <div class="image-viewport" id="image-viewport"><div class="camera-layer" id="camera-layer"><img id="lesson-image" alt="" draggable="false"></div></div>
              <div class="spotlight" id="spotlight" aria-hidden="true"></div>
              <div class="cinematic-shade" aria-hidden="true"></div>
              <svg id="teaching-pointer" class="teaching-pointer" aria-hidden="true" hidden>
                <ellipse id="target-region" class="target-region"/>
                <path id="pointer-outline" class="pointer-outline"/>
                <path id="pointer-shaft" class="pointer-shaft"/>
                <path id="pointer-head" class="pointer-head"/>
                <circle id="pointer-tip" class="pointer-tip" r="3"/>
                <g id="pointer-hand" class="pointer-hand"><path d="M0 0C-3 0-5 2-5 5v14l-3-3c-4-5-10 0-6 6l9 12q3 4 9 4h13q7-1 7-9V17q-1-6-6-4-1-6-6-4-3-5-7-2V5Q5 0 0 0Z"/><path class="hand-detail" d="M5 10v11m7-8v10m6-7v8M-3 31h20"/></g>
              </svg>
              <div class="card-topline"><span id="lesson-specialty" class="eyebrow-pill"></span><span class="lesson-position" id="lesson-position"></span></div>
              <div id="focus-label" class="focus-label" hidden></div>
              <div id="scene-heading" class="scene-heading" aria-hidden="true"></div>
              <button class="center-play" id="center-play" type="button" data-action="play" aria-label="Play lesson"><svg viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z" fill="currentColor" stroke="none"/></svg></button>
              <div class="action-rail">
                <button type="button" class="rail-action" id="like-button" data-action="like" aria-label="Save lesson" aria-pressed="false"><span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M20.5 5.5a5.3 5.3 0 0 0-7.5 0L12 6.6l-1.1-1.1a5.3 5.3 0 1 0-7.5 7.5L12 21l8.5-8a5.3 5.3 0 0 0 0-7.5Z"/></svg></span><span>Save</span></button>
                <button type="button" class="rail-action" data-action="note" aria-label="Write a private note"><span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-3.5-.7L3 21l1.7-5a9 9 0 0 1-.7-3.5A8.5 8.5 0 0 1 12.5 4H13M16 3h5v5M12 12l9-9"/></svg></span><span>Note</span></button>
                <button type="button" class="rail-action" data-action="source" aria-label="Read lesson source and image credits"><span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4zM13 7a3 3 0 0 1 3-3h5v15h-4a4 4 0 0 0-4 2"/></svg></span><span>Source</span></button>
              </div>
              <div class="lesson-copy">
                <div class="locus-label" id="locus-label"></div>
                <h1 id="lesson-title"></h1>
                <p class="lesson-caption" id="lesson-caption"></p>
                <div id="lesson-tags" class="lesson-tags"></div>
              </div>
              <div class="real-image-badge" id="real-image-badge" hidden><span class="status-dot"></span><span>REAL CLINICAL IMAGE</span><button type="button" data-action="image-credit" aria-label="Read image license">ⓘ</button></div>
            </div>
            <div class="player">
              <label class="visually-hidden" for="seek">Lesson playback position</label>
              <input id="seek" class="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Lesson playback position">
              <div class="player-row">
                <button class="play-button icon-button" id="play-button" type="button" data-action="play" aria-label="Play lesson"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"/></svg></button>
                <span class="playback-time"><span id="current-time">0:00</span><span class="time-divider">/</span><span id="duration-time">0:00</span></span>
                <button class="speed-button" type="button" data-action="speed" id="speed-button" aria-label="Change playback speed">1×</button>
                <button class="caption-button icon-button" id="caption-button" type="button" data-action="captions" aria-label="Captions and transcript" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10a2 2 0 1 0 0 4m7-4a2 2 0 1 0 0 4"/></svg></button>
                <button class="next-button" type="button" data-action="next" aria-label="Next lesson">Next<svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
              </div>
            </div>
          </article>
          <div class="feed-empty" id="feed-empty"><div class="loading-orbit" aria-hidden="true"></div><h1>Opening your gallery</h1><p>Preparing lessons on this device.</p></div>
        </div>
        <div class="feed-bottomline"><span id="feed-status">Watch the lesson, then answer.</span><button type="button" data-action="lesson-question" id="lesson-question-button">Go to question <span aria-hidden="true">↗</span></button></div>
      </section>
      <section id="screen-publications" class="screen scroll-screen" aria-labelledby="publications-heading" hidden></section>
      <section id="screen-review" class="screen scroll-screen" aria-labelledby="review-heading" hidden></section>
      <section id="screen-insights" class="screen scroll-screen" aria-labelledby="insights-heading" hidden></section>
      <section id="screen-settings" class="screen scroll-screen" aria-labelledby="settings-heading" hidden></section>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" type="button" data-tab="feed" aria-current="page"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="4"/><path d="m10 9 5 3-5 3Z"/></svg><span>Feed</span></button>
      <button class="nav-item" type="button" data-tab="publications"><svg viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4zM13 7a3 3 0 0 1 3-3h5v15h-4a4 4 0 0 0-4 2"/></svg><span>Publications</span></button>
      <button class="nav-item" type="button" data-tab="review"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 .6 6M4 4v6h6M12 7v5l3 2"/></svg><i id="nav-review-badge" class="nav-badge" hidden>0</i></span><span>Review</span></button>
      <button class="nav-item" type="button" data-tab="insights"><svg viewBox="0 0 24 24"><path d="M5 20V13M12 20V5M19 20V9"/></svg><span>Insights</span></button>
      <button class="nav-item" type="button" data-tab="settings"><svg viewBox="0 0 24 24"><path d="m10 3-.5 3-2 .9L5 5.5 2.5 9 5 11v2l-2.5 2L5 18.5l2.5-1.4 2 .9.5 3h4l.5-3 2-.9 2.5 1.4 2.5-3.5L19 13v-2l2.5-2L19 5.5l-2.5 1.4-2-.9L14 3z"/><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></button>
    </nav>
  </div>
  <audio id="lesson-audio" preload="metadata"></audio>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal-sheet" id="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="modal-header"><div><span class="modal-eyebrow" id="modal-eyebrow"></span><h2 id="modal-title"></h2></div><button class="icon-button close-button" type="button" data-action="close-modal" aria-label="Close dialog"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions" hidden></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="backup-file" accept="application/json,.json" hidden>
  <noscript>This application needs JavaScript to play your lessons and keep review progress.</noscript>
</body>
</html>
