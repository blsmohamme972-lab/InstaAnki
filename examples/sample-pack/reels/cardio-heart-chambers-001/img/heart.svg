<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200">
  <!-- مخطط تبسيطي لحجرات القلب، للتوضيح فقط وليس رسماً تشريحياً دقيقاً.
       لا نصوص داخل الصورة: التسميات يرسمها التطبيق فوقها من regions.label -->
  <g id="aorta">
    <path d="M 600 640 L 600 200 Q 600 80 720 80 Q 840 80 840 200 L 840 300"
          fill="none" stroke="#c9302c" stroke-width="80" stroke-linecap="round"/>
  </g>
  <g id="pulmonary-trunk">
    <rect x="455" y="170" width="90" height="470" rx="40" fill="#6f95d6" stroke="#2f5597" stroke-width="8"/>
    <rect x="370" y="150" width="260" height="64" rx="32" fill="#6f95d6" stroke="#2f5597" stroke-width="8"/>
  </g>
  <g id="superior-vena-cava">
    <rect x="215" y="40" width="90" height="320" rx="40" fill="#6f95d6" stroke="#2f5597" stroke-width="8"/>
  </g>
  <g id="right-atrium">
    <rect x="150" y="330" width="290" height="250" rx="95" fill="#a9c4ef" stroke="#2f5597" stroke-width="10"/>
  </g>
  <g id="left-atrium">
    <rect x="660" y="330" width="250" height="230" rx="90" fill="#f2a7a3" stroke="#8e1b1b" stroke-width="10"/>
  </g>
  <g id="right-ventricle">
    <path d="M 160 620 L 490 620 L 500 960 Q 330 1015 205 885 Q 150 760 160 620 Z"
          fill="#a9c4ef" stroke="#2f5597" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <g id="left-ventricle">
    <path d="M 530 625 L 870 625 Q 895 900 700 1110 Q 540 950 530 625 Z"
          fill="#f2a7a3" stroke="#8e1b1b" stroke-width="46" stroke-linejoin="round"/>
  </g>
</svg>
