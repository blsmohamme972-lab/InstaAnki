name: Source scope

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests cover their branch updates; running a second push job would
# fetch the same reviewed images twice and needlessly hit source rate limits.
concurrency:
  group: source-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-book-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject an unexpected publication or unverified bundled lesson
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install Pillow==13.0.0
          python3 tools/prepare_existing_media.py --download-sources
          python3 tools/check_source_scope.py
      - name: Verify source, presentation, lossless media, packaging and signing safeguards
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build the offline learning bundle and verify progress/feedback behavior
        run: |
          npm ci
          npm run build:web
          npm test
      - name: Check the actual mobile player and collection updates
        run: |
          npx playwright install --with-deps chromium --only-shell
          node tests/reels-browser.cjs
