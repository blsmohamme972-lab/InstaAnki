name: GitHub native reporting tests

on:
  pull_request:
    paths:
      - 'android/src/com/instaanki/app/GithubFeedback.java'
      - 'android/src/com/instaanki/app/MainActivity.java'
      - 'web/app.js'
      - 'tests/github-native-feedback.test.cjs'
      - '.github/workflows/github-native-reporting.yml'
  push:
    branches: [main]
    paths:
      - 'android/src/com/instaanki/app/GithubFeedback.java'
      - 'android/src/com/instaanki/app/MainActivity.java'
      - 'web/app.js'
      - 'tests/github-native-feedback.test.cjs'
      - '.github/workflows/github-native-reporting.yml'

permissions:
  contents: read

jobs:
  native-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test feature and compile source bundle
        run: |
          node --test tests/github-native-feedback.test.cjs
          npm ci
          npm run build:web:fresh
          npm run source:check:fresh
          npm test
          python3 -m unittest discover -s tests -p 'test_android_fresh_profile.py' -v
      - name: Test actual Fresh browser interaction
        run: |
          npx playwright install --with-deps chromium --only-shell
          npm run test:fresh
      - name: Get pinned Android toolchain
        run: python3 android/bootstrap_sdk.py --sdk-dir /tmp/instaanki-sdk
      - name: Compile Android APK with GitHub bridge (no signing material)
        run: |
          python3 android/build_apk.py --profile fresh --web-dir build/fresh-web \
            --sdk-dir /tmp/instaanki-sdk --unsigned --version-code 6 --version-name 0.3.2 \
            --output dist/InstaAnki-Fresh-0.3.2-unsigned.apk
      - name: Verify manifest and create offline signing bundle
        shell: bash
        run: |
          set -euo pipefail
          TOOLS=/tmp/instaanki-sdk/build-tools/android-15
          if [ -d /tmp/instaanki-sdk/build-tools/35.0.0 ]; then TOOLS=/tmp/instaanki-sdk/build-tools/35.0.0; fi
          mkdir -p dist/offline-signing-tools/lib64
          cp "$TOOLS/lib/apksigner.jar" dist/offline-signing-tools/
          cp "$TOOLS/aapt2" "$TOOLS/zipalign" dist/offline-signing-tools/
          if [ -d "$TOOLS/lib64" ]; then cp -a "$TOOLS/lib64/." dist/offline-signing-tools/lib64/; fi
          "$TOOLS/aapt2" dump badging dist/InstaAnki-Fresh-0.3.2-unsigned.apk > dist/manifest-badging.txt
          python3 - <<'PY'
          import json, pathlib, zipfile
          root=pathlib.Path('dist')
          badging=(root/'manifest-badging.txt').read_text()
          assert "package: name='com.instaanki.fresh' versionCode='6' versionName='0.3.2'" in badging
          with zipfile.ZipFile(root/'InstaAnki-Fresh-0.3.2-unsigned.apk') as z:
              names=z.namelist()
              app=json.loads(z.read('assets/www/data/distribution.json'))
              assert app['app']=={'packageName':'com.instaanki.fresh','version':'0.3.2','versionCode':6}
              assert json.loads(z.read('assets/www/data/lessons.json')) == []
              assert not any(n.startswith('assets/www/media/') for n in names)
              assert not any(n.endswith('.mp4') or n.endswith('.p12') for n in names)
          PY
          sha256sum dist/InstaAnki-Fresh-0.3.2-unsigned.apk > dist/unsigned.sha256
          git rev-parse HEAD > dist/source-commit.txt
      - name: Preserve candidate without private signing material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: InstaAnki-Fresh-0.3.2-github-reporting-unsigned
          path: dist/
          retention-days: 3
          if-no-files-found: error
