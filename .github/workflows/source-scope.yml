name: Source scope

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests cover their branch updates; running a second push job would
# fetch the same reviewed images twice and needlessly hit source rate limits.
concurrency:
  group: source-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fresh-empty-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify authoring checkpoints without old lesson media
        run: |
          python3 -m pip install Pillow==13.0.0
          PYTHONPATH=tests python3 -m unittest test_image_prompt_gate test_production_trial test_source_policy.SourceEvidenceTests test_visual_source_review test_prepare_book_guidance test_native_import_runner -v
      - name: Verify native import preservation without an old APK or lesson ZIP
        run: |
          mkdir -p build/test-deps
          curl --fail --location --retry 2 --proto '=https' --proto-redir '=https' --output build/test-deps/json-20240303.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          python3 tools/test_native_import.py --json-jar build/test-deps/json-20240303.jar
      - name: Verify the fresh app without restoring any old lesson media
        run: |
          python3 -m unittest discover -s tests -p 'test_fresh_distribution.py' -v
          python3 -m unittest discover -s tests -p 'test_android_fresh_profile.py' -v
          npm ci
          npm run build:web:fresh
          npm run source:check:fresh
      - name: Check the empty collection and application-specific update offers
        run: |
          npx playwright install --with-deps chromium --only-shell
          npm run test:fresh
          npm run test:imports
  original-book-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject an unexpected publication or unverified bundled lesson
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install Pillow==13.0.0
          python3 tools/prepare_existing_media.py --download-sources
          python3 tools/check_source_scope.py
      - name: Verify source, presentation, lossless media, packaging and signing safeguards
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build the offline learning bundle and verify progress/feedback behavior
        run: |
          npm ci
          npm run build:web
          npm test
      - name: Check the actual mobile player and collection updates
        run: |
          npx playwright install --with-deps chromium --only-shell
          node tests/reels-browser.cjs
